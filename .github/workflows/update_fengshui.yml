name: Run Content Automation Bot

on:
  schedule:
    - cron: '0 0 * * *' # 每日定時執行一次（可根據需要調整）
  workflow_dispatch:      # 允許手動在 GitHub Actions 頁面觸發

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run main bot script
        env:
          AI_WORKER_URL: ${{ secrets.AI_WORKER_URL }}
        run: |
          python main_bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update daily content [skip ci]" || echo "No changes to commit"
          
          # 先拉取遠端最新變更，避免 fast-forward 衝突
          git pull --rebase origin main || git pull --rebase origin master
          
          # 推送更新返倉庫
          git push origin HEAD:main || git push origin HEAD:master
