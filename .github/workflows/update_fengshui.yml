name: Auto Fetch Fengshui Data

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 個鐘執行一次
  workflow_dispatch: # 支援手動即時觸發

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予寫入 Repo 的權限

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: |
          pip install requests

      - name: 執行抓取腳本
        run: |
          python fetch_fengshui.py

      - name: 提交並推送更新
        run: |
          git pull origin main || true
          git push
