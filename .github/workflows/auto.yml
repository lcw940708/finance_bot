name: Auto Finance Update

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-blog:
    runs-on: ubuntu-latest
    
    # 明確授權寫入權限，解決 403 錯誤
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Main Bot Script
      run: python main_bot.py
      env:
        AI_WORKER_URL: ${{ secrets.AI_WORKER_URL }}

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add posts/ trends/ index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update finance, trends and index [skip ci]" && git push)
