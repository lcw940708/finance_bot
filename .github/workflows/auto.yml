name: Auto Finance and Trends Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # 關鍵：授權 GitHub Actions 可以修改和推送檔案
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Main Bot Script
      run: python main_bot.py
      env:
        AI_WORKER_URL: ${{ secrets.AI_WORKER_URL }}

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # 將所有產生的目錄與主頁加入版控
        git add posts/ trends/ index.html

        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update posts, trends and index [skip ci]" && git push)
