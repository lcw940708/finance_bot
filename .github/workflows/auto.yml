name: Run AI Bot Daily

on:
  schedule:
    - cron: '0 0 0 * *' # 每日定時執行（可按需求調整時間）
  workflow_dispatch: # 允許手動隨時觸發

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝依賴套件 (requests & yt-dlp)
        run: pip install requests yt-dlp

      - name: 4. 執行 Bot 程式
        env:
          AI_WORKER_URL: ${{ secrets.AI_WORKER_URL }}
        run: python3 main_bot.py

      - name: 5. 自動 Commit 並 Push 變動返 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ trends/ horoscope/ videos/ index.html
          git commit -m "Auto-update AI daily content (Finance, Trends, Horoscope, Videos)" || exit 0
          git push
